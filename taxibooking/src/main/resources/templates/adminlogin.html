<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Taxi App</title>
    <!-- FIX 1: Correct Tailwind Link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FIX 2: Correct Font Awesome Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .modal-active {
            display: flex !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600 min-h-screen flex items-center justify-center p-4">

    <!-- Login Card -->
    <div class="glass-effect w-full max-auto max-w-md p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-yellow-100 text-yellow-600 mb-4">
                <i class="fa-solid fa-taxi fa-3x"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Admin Login</h1>
            <p class="text-gray-500 mt-2">Manage your taxi fleet with ease</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">
            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <div class="mt-1 relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500" 
                        placeholder="Enter your username">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1 relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500" 
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-xl transition-all transform hover:scale-[1.02] shadow-lg">
                Login
            </button>
        </form>
    </div>

    <!-- Modal Popup for Success/Error -->
    <div id="statusModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black bg-opacity-50 px-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl transform transition-all">
            <div id="modalIcon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4">
                <!-- Icon injected by JS -->
            </div>
            <h3 id="modalTitle" class="text-xl font-bold text-gray-900 mb-2"></h3>
            <p id="modalMsg" class="text-gray-500 mb-6"></p>
            <button onclick="closeModal()" class="w-full py-2 px-4 bg-gray-800 text-white rounded-lg hover:bg-gray-900">
                Close
            </button>
        </div>
    </div>

    <script th:inline="javascript">
        const urlParams = new URLSearchParams(window.location.search);
        const modal = document.getElementById('statusModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMsg = document.getElementById('modalMsg');

        // Check for Login Error (Spring Security adds ?error)
        if (urlParams.has('error')) {
            showModal('error', 'Login Failed', 'Invalid username or password. Please try again.');
        }

        // Check for Logout Success (Spring Security adds ?logout)
        if (urlParams.has('logout')) {
            showModal('success', 'Logged Out', 'You have been successfully logged out.');
        }

        function showModal(type, title, message) {
            modal.classList.add('modal-active');
            modalTitle.innerText = title;
            modalMsg.innerText = message;
            
            if (type === 'error') {
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-3xl"></i>';
                modalIcon.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4 bg-red-100 text-red-600";
            } else {
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-check text-3xl"></i>';
                modalIcon.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4 bg-green-100 text-green-600";
            }
        }

        function closeModal() {
            modal.classList.remove('modal-active');
        }
    </script>
</body>
</html>
