<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<title>Home</title>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no" />

<link rel="icon" th:href="@{/images/favicon.ico}">
<link rel="shortcut icon" th:href="@{/images/favicon.ico}" />

<link rel="stylesheet" th:href="@{/booking/css/booking.css}">
<link rel="stylesheet" th:href="@{/css/camera.css}">
<link rel="stylesheet" th:href="@{/css/owl.carousel.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
/* Base style for all alert boxes */
.alert-box {
	padding: 15px;
	margin-bottom: 20px;
	border-radius: 4px;
	display: flex;
	align-items: center;
	font-weight: bold;
	border-left: 5px solid;
	/* Thickness remains the same, color changes by class */
}

.alert-box .icon {
	margin-right: 10px;
	font-size: 1.2em;
}

/* Success Message Styles */
.alert-success {
	background-color: #e7f4e4; /* Light green background */
	border-left-color: #28a745; /* Dark green left border */
	color: #155724; /* Dark green text */
}

/* Error Message Styles */
.alert-error {
	background-color: #fff3f3;
	/* Light red background (from your original) */
	border-left-color: #ff4d4d; /* Bright red left border */
	color: #851e1e; /* Dark red text */
}
</style>

<script th:src="@{/js/jquery.js}"></script>
<script th:src="@{/js/jquery-migrate-1.2.1.js}"></script>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/superfish.js}"></script>
<script th:src="@{/js/jquery.ui.totop.js}"></script>
<script th:src="@{/js/jquery.equalheights.js}"></script>
<script th:src="@{/js/jquery.mobilemenu.js}"></script>
<script th:src="@{/js/jquery.easing.1.3.js}"></script>
<script th:src="@{/js/owl.carousel.js}"></script>
<script th:src="@{/js/camera.js}"></script>
<script th:src="@{/js/jquery.mobile.customized.min.js}"></script>
<script th:src="@{/booking/js/booking.js}"></script>

<script>
	$(document).ready(function() {
		jQuery('#camera_wrap').camera({
			loader : false,
			pagination : false,
			minHeight : '444',
			thumbnails : false,
			height : '28.28125%',
			caption : true,
			navigation : true,
			fx : 'mosaic'
		});
		$().UItoTop({
			easingType : 'easeOutQuart'
		});
	});
</script>
</head>
<body class="page1" id="top">
	<div class="main">
		<!-- HEADER START -->
		<div th:insert="~{fragments/header.html}"></div>
		<!-- HEADER END -->

		<div class="slider_wrapper">
			<div id="camera_wrap">
				<div th:data-src="@{/images/slide.jpg}"></div>
				<div th:data-src="@{/images/slide1.jpg}"></div>
				<div th:data-src="@{/images/slide2.jpg}"></div>
			</div>
		</div>

		<div class="container_12">
			<div class="grid_4">
				<div class="banner">
					<div class="maxheight">
						<div class="banner_title">
							<img th:src="@{/images/icon1.png}" alt="">
							<div class="extra_wrapper">
								Fast&amp;
								<div class="color1">Safe</div>
							</div>
						</div>
						Dorem ipsum dolor sit amet, consectetur adipiscinger elit... <a
							href="#" class="fa fa-share-square"></a>
					</div>
				</div>
			</div>
			<div class="grid_4">
				<div class="banner">
					<div class="maxheight">
						<div class="banner_title">
							<img th:src="@{/images/icon2.png}" alt="">
							<div class="extra_wrapper">
								Best
								<div class="color1">Prices</div>
							</div>
						</div>
						Hem ipsum dolor sit amet... <a href="#" class="fa fa-share-square"></a>
					</div>
				</div>
			</div>
			<div class="grid_4">
				<div class="banner">
					<div class="maxheight">
						<div class="banner_title">
							<img th:src="@{/images/icon3.png}" alt="">
							<div class="extra_wrapper">
								Package
								<div class="color1">Delivery</div>
							</div>
						</div>
						Kurem ipsum dolor sit amet... <a href="#"
							class="fa fa-share-square"></a>
					</div>
				</div>
			</div>
			<div class="clear"></div>
		</div>

		<div class="c_phone">
			<div class="container_12">
				<div class="grid_12">
					<div class="fa fa-phone"></div>
					+91 9315917780 <span>ORDER NOW!</span>
				</div>
				<div class="clear"></div>
			</div>
		</div>

		<div class="content">
			<div class="container_12">
				<div class="grid_5">
					<h3>Booking Form</h3>
					
					<!-- Example of a Success Message -->
					<div th:if="${success}" class="alert-box alert-success">
						<span class="icon">✔️</span>
						<p th:text="${success}"></p>
					</div>

					<!-- Example of an Error Message -->
					<div th:if="${error}" class="alert-box alert-error">
						<span class="icon">⚠️</span>
						<p th:text="${error}"></p>
					</div>
					
					<form id="bookingForm" th:action="@{/bookingform}"
						th:object="${bookingForm}" method="post">
						<div class="fl1">
							<div class="tmInput">
								<input name="name" placeholder="Name" type="text"
									th:value="${bookingForm.name}"> <span
									style="color: red" th:if="${#fields.hasErrors('name')}"
									th:errors="*{name}"></span>
							</div>
							<div class="tmInput">
								<input name="from" placeholder="From" type="text"
									th:value="${bookingForm.from}"> <span
									style="color: red" th:if="${#fields.hasErrors('from')}"
									th:errors="*{from}"></span>
							</div>
						</div>
						<div class="fl1">
							<div class="tmInput">
								<input name="email" placeholder="Email" type="text"
									th:value="${bookingForm.email}"> <span
									style="color: red" th:if="${#fields.hasErrors('email')}"
									th:errors="*{email}"></span>
							</div>
							<div class="tmInput mr0">
								<input name="to" placeholder="To" type="text"
									th:value="${bookingForm.to}"> <span style="color: red"
									th:if="${#fields.hasErrors('to')}" th:errors="*{to}"></span>
							</div>
						</div>
						<div class="clear"></div>
						<strong>Time</strong>
						<div class="tmInput">
							<input name="time" type="time" th:value="${bookingForm.time}">
							<span style="color: red" th:if="${#fields.hasErrors('time')}"
								th:errors="*{time}"></span>
						</div>
						<div class="clear"></div>
						<strong>Date</strong> <label> <input type="date"
							name="date" placeholder='28/04/2026'
							th:value="${bookingForm.date}"> <span style="color: red"
							th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
						</label>
						<div class="clear"></div>
						<br>
						<div class="tmRadio">
							<span style="color: red" th:if="${#fields.hasErrors('comfort')}"
								th:errors="*{comfort}"></span>
							<p>Comfort</p>
							<input name="comfort" type="radio" th:field="*{comfort}"
								value="cheap" id="tmRadio0" checked /> <span>Cheap</span> <input
								name="comfort" type="radio" th:field="*{comfort}"
								value="standard" id="tmRadio1" /> <span>Standard</span> <input
								name="comfort" type="radio" th:field="*{comfort}" value="lux"
								id="tmRadio2" /> <span>Lux</span>
						</div>
						<div class="clear"></div>
						<!-- ERROR MESSAGE -->
						<!-- <div th:if="${message}" class="alert-box">
							<span class="icon">⚠️</span>
							<p th:text="${message}"></p>
						</div> -->
						<!-- ERROR MESSAGE -->
						<span style="color: red" th:if="${#fields.hasErrors('adult')}"
							th:errors="*{adult}"></span>
						<div class="fl1 fl2">
							<em>Adult</em> <select name="adult" class="tmSelect auto"
								th:field="*{adult}">
								<option value="1" th:selected="${bookingForm.adult==1}">1</option>
								<option value="1">1</option>
								<option value="2" th:selected="${bookingForm.adult==2}">2</option>
								<option value="3" th:selected="${bookingForm.adult==3}">3</option>
								<option value="4" th:selected="${bookingForm.adult==4}">4</option>
							</select>
						</div>
						<span style="color: red" th:if="${#fields.hasErrors('children')}"
							th:errors="*{children}"></span>
						<div class="fl1 fl2">
							<em>Children</em> <select name="children" class="tmSelect auto"
								th:value="${bookingForm.children}">
								<option value="0" th:selected="${bookingForm.children==0}">0</option>
								<option value="0">0</option>
								<option value="1" th:selected="${bookingForm.children==1}">1</option>
								<option value="2" th:selected="${bookingForm.children==2}">2</option>
								<option value="3" th:selected="${bookingForm.children==3}">3</option>
							</select>
						</div>
						<div class="clear"></div>
						<div class="tmTextarea">
							<textarea name="message" placeholder="Message"
								th:text="${bookingForm.message}"></textarea>
						</div>
						<span style="color: red" th:if="${#fields.hasErrors('message')}"
							th:errors="*{message}"></span>
						<button type="submit" class="btn">Submit</button>
					</form>
				</div>
				<div class="grid_6 prefix_1">
					<a th:href="@{/cars/economy}" class="type"><img
						th:src="@{/images/page1_img1.jpg}" alt=""><span
						class="type_caption">Economy</span></a> <a th:href="@{/cars/standard}"
						class="type"><img th:src="@{/images/page1_img2.jpg}" alt=""><span
						class="type_caption">Standard</span></a> <a th:href="@{/cars/lux}"
						class="type"><img th:src="@{/images/page1_img3.jpg}" alt=""><span
						class="type_caption">Lux</span></a>
				</div>
				<div class="clear"></div>
			</div>
		</div>
	</div>

	<!-- FOOTER START -->
	<div th:insert="~{fragments/footer.html}"></div>
	<!-- FOOTER END -->

	<script>
		$(function() {
			$('#bookingForm').bookingForm({
				ownerEmail : '#'
			});
		})
		$(function() {
			$('#bookingForm input, #bookingForm textarea').placeholder();
		});
	</script>
</body>
</html>
