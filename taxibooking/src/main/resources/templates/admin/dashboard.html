<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Taxi Service</title>

<!-- 1. OFFICIAL TAILWIND PLAY CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- 2. WORKING FONT AWESOME LINK -->
<link rel="stylesheet" href="https://cloudflare.com">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
	integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal">

	<!-- TOP NAVIGATION -->
	<nav
		class="fixed top-0 z-50 w-full bg-white border-b border-gray-200 shadow-sm">
		<div class="px-3 py-3 lg:px-5 lg:pl-3">
			<div class="flex items-center justify-between">
				<div class="flex items-center">
					<!-- Brand -->
					<div class="flex items-center md:w-64">
						<i class="fa-solid fa-taxi text-yellow-500 text-2xl mr-3"></i> <span
							class="self-center text-xl font-bold sm:text-2xl whitespace-nowrap text-gray-800">TAXI
							ADMIN</span>
					</div>
				</div>
				<div class="flex items-center gap-6">
					<!-- VIEW MAIN WEBSITE LINK -->
					<a th:href="@{/}" target="_blank"
						class="hidden md:flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 transition">
						<i class="fa-solid fa-up-right-from-square mr-2"></i> View Main
						Site
					</a>

					<!-- ADMIN PROFILE INFO -->
					<div class="flex items-center ml-3 border-l pl-6 border-gray-100">
						<div class="flex items-center space-x-3">
							<div class="text-right hidden sm:block">
								<p class="text-sm font-bold text-gray-700 leading-none">Admin
									User</p>
								<p class="text-xs text-gray-400 mt-1">Super Administrator</p>
							</div>
							<a th:href="@{/admin/profile}"> <img
								class="w-10 h-10 rounded-full border-2 border-yellow-400 hover:scale-105 transition object-cover"
								src="https://ui-avatars.com" alt="admin photo">
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</nav>

	<div class="flex pt-16 overflow-hidden bg-gray-50">

		<!-- SIDEBAR -->
		<aside
			class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform -translate-x-full bg-gray-900 md:translate-x-0">
			<div class="h-full px-3 pb-4 overflow-y-auto bg-gray-900">
				<ul class="space-y-2 font-medium">
					<li><a href="#"
						class="flex items-center p-3 text-white rounded-lg hover:bg-gray-800 group">
							<i
							class="fa-solid fa-chart-pie w-5 h-5 text-gray-400 transition group-hover:text-yellow-500"></i>
							<span class="ml-3">Dashboard</span>
					</a></li>
					<li><a th:href="@{/admin/readallcontacts}"
						class="flex items-center p-3 text-white rounded-lg hover:bg-gray-800 group">
							<i
							class="fa-solid fa-address-book w-5 h-5 text-gray-400 transition group-hover:text-yellow-500"></i>
							<span class="ml-3">Contacts</span>
					</a></li>
					<li><a th:href="@{/admin/profile}"
						class="flex items-center p-3 text-white rounded-lg hover:bg-gray-800 group">
							<i
							class="fa-solid fa-user-gear w-5 h-5 text-gray-400 transition group-hover:text-yellow-500"></i>
							<span class="ml-3">Profile Settings</span>
					</a></li>
					<li class="pt-4 mt-4 border-t border-gray-700">
						<form th:action="@{/dologout}" method="post" id="logoutForm"
							class="hidden"></form> <a href="javascript:void(0)"
						onclick="document.getElementById('logoutForm').submit();"
						class="flex items-center p-3 text-red-400 rounded-lg hover:bg-red-900/20 group">
							<i
							class="fa-solid fa-right-from-bracket w-5 h-5 transition group-hover:text-red-500"></i>
							<span class="ml-3 font-semibold">Logout</span>
					</a>
					</li>
				</ul>
			</div>
		</aside>

		<!-- MAIN CONTENT AREA -->
		<div
			class="relative w-full h-full overflow-y-auto bg-gray-50 md:ml-64">
			<main class="p-6">
				<!-- 1. Stats Row -->
				<div
					class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
					<div
						class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center">
						<div class="p-4 bg-yellow-100 rounded-xl text-yellow-600 mr-4">
							<i class="fa-solid fa-envelope-open-text fa-2x"></i>
						</div>
						<div>
							<p class="text-sm font-medium text-gray-500">Total Contacts</p>
							<h3 class="text-2xl font-bold text-gray-800">128</h3>
						</div>
					</div>
					<!-- Add more cards as needed... -->
				</div>

				<!-- 2. PROFILE EDIT SECTION (Real-time form) -->
				<div
					class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
					<div class="p-6 border-b border-gray-100">
						<h2 class="text-xl font-bold text-gray-800">Admin Account
							Settings</h2>
					</div>
					<div class="p-8">
						<form th:action="@{/admin/update-profile}" method="post"
							enctype="multipart/form-data">
							<div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
								<!-- Photo Upload -->
								<div class="text-center">
									<div class="relative inline-block group">
										<img
											class="w-40 h-40 rounded-full border-4 border-white shadow-lg object-cover"
											src="https://ui-avatars.com" id="avatarPreview"> <label
											for="imgUpload"
											class="absolute bottom-2 right-2 bg-yellow-500 p-3 rounded-full text-white cursor-pointer shadow-xl hover:bg-yellow-600 transition">
											<i class="fa-solid fa-camera"></i> <input type="file"
											id="imgUpload" name="profileImage" class="hidden"
											onchange="previewFile()">
										</label>
									</div>
									<p class="mt-4 text-xs text-gray-400">Click icon to change
										profile picture</p>
								</div>

								<!-- Information Fields -->
								<div class="lg:col-span-2 space-y-6">
									<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
										<div>
											<label class="block text-sm font-semibold text-gray-600 mb-2">Admin
												Full Name</label> <input type="text" name="name" value="Admin Name"
												class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none transition">
										</div>
										<div>
											<label class="block text-sm font-semibold text-gray-600 mb-2">Email
												Address</label> <input type="email" name="email"
												value="admin@taxitaxi.com"
												class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none transition">
										</div>
									</div>

									<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
										<div>
											<label class="block text-sm font-semibold text-gray-600 mb-2">Old
												Password</label> <input type="password" name="password"
												placeholder="Leave blank to keep same"
												class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none transition">
										</div>
										<div>
											<label class="block text-sm font-semibold text-gray-600 mb-2">New
												Password</label> <input type="password" name="password"
												placeholder="Leave blank to keep same"
												class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none transition">
										</div>
									</div>
									<div class="flex items-end">
										<button type="submit"
											class="w-full bg-gray-900 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-800 shadow-lg hover:shadow-yellow-500/20 transition duration-300">
											Update Admin Profile</button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</main>
		</div>
	</div>

	<!-- JS for Image Preview -->
	<script>
        function previewFile() {
            const preview = document.querySelector('#avatarPreview');
            const file = document.querySelector('#imgUpload').files[0];
            const reader = new FileReader();
            reader.addEventListener("load", () => { preview.src = reader.result; }, false);
            if (file) { reader.readAsDataURL(file); }
        }
    </script>
</body>
</html>
