<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye | Admin Logout</title>
    
    <!-- FIX 1: Correct Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FIX 2: Correct Font Awesome CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <!-- Logout Content -->
    <div class="animate-fade-up glass-card max-w-md w-full rounded-3xl shadow-2xl p-10 text-center border-t-8 border-yellow-500">
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-yellow-100 rounded-full mb-4">
                <i class="fa-solid fa-door-open text-yellow-600 text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-800">Logged Out</h1>
            <p class="text-gray-500 mt-3">Your session has ended safely. Thank you for managing the fleet today!</p>
        </div>

        <div class="space-y-4">
            <a th:href="@{/login}" 
               class="block w-full py-3 px-6 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-xl transition duration-300 shadow-lg hover:shadow-yellow-200/50">
                Back to Login
            </a>
            <p class="text-xs text-gray-400 uppercase tracking-widest">Taxi App Admin Portal</p>
        </div>
    </div>

    <!-- Modal Popup for Instant Feedback -->
    <div id="logoutModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl scale-95 transition-transform duration-300" id="modalContent">
            <div id="modalIconContainer" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4">
                <i id="modalIcon" class="fa-solid fa-3x"></i>
            </div>
            <h3 id="modalTitle" class="text-2xl font-bold text-gray-900 mb-2"></h3>
            <p id="modalMsg" class="text-gray-600 mb-6"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition">
                Understood
            </button>
        </div>
    </div>

    <script th:inline="javascript">
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Success Case
            if (urlParams.has('success')) {
                showStatusModal('success', 'Safe Exit', 'You have been successfully logged out of the system.');
            }
            
            // Error Case (e.g., session expired or invalid logout attempt)
            if (urlParams.has('error')) {
                showStatusModal('error', 'Session Issue', 'There was a problem logging you out, or your session already expired.');
            }
        };

        function showStatusModal(type, title, message) {
            const modal = document.getElementById('logoutModal');
            const icon = document.getElementById('modalIcon');
            const container = document.getElementById('modalIconContainer');
            
            modal.classList.remove('hidden');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = message;

            if (type === 'success') {
                icon.className = "fa-solid fa-circle-check text-green-600";
                container.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4 bg-green-100";
            } else {
                icon.className = "fa-solid fa-triangle-exclamation text-red-600";
                container.className = "mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4 bg-red-100";
            }
        }

        function closeModal() {
            document.getElementById('logoutModal').classList.add('hidden');
        }
    </script>

</body>
</html>
